name: AutoResolve Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - autoresolve/isolated-fixes

permissions:
  contents: read

concurrency:
  group: autoresolve-tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python 3.12 test suite
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build restricted Docker test worker
        run: docker build --file docker/worker.Dockerfile --tag autoresolve-test-worker:python312 .

      - name: Run test suite
        run: python -m pytest -q
